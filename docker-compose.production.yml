services:
  web-production:
    image: barbershop-mvp:local
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - node
      - server.mjs
      - --port
      - "8080"
      - --gateway
      - http://api-gateway:3000
    environment:
      NODE_ENV: production
      PORT: "8080"
      GATEWAY_URL: http://api-gateway:3000
    ports:
      - "${LANDING_PORT:-8080}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
