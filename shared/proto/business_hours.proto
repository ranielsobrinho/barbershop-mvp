syntax = "proto3";

package barbershop.business_hours;

service BusinessHoursService {
  rpc GetBusinessHours(GetBusinessHoursRequest) returns (GetBusinessHoursResponse);
  rpc UpdateBusinessHours(UpdateBusinessHoursRequest) returns (UpdateBusinessHoursResponse);
}

message BusinessHours {
  string id = 1;
  int32 weekday = 2; // 0=Sun ... 6=Sat
  string opens_at = 3; // HH:mm
  string closes_at = 4; // HH:mm
  string break_start = 5; // HH:mm
  string break_end = 6; // HH:mm
  bool active = 7;
  string created_at = 8;
  string updated_at = 9;
}

message GetBusinessHoursRequest {}
message GetBusinessHoursResponse {
  repeated BusinessHours hours = 1;
}

message UpdateBusinessHoursRequest {
  repeated BusinessHoursInput hours = 1;
}

message BusinessHoursInput {
  int32 weekday = 1;
  string opens_at = 2;
  string closes_at = 3;
  string break_start = 4;
  string break_end = 5;
  bool active = 6;
}

message UpdateBusinessHoursResponse {
  repeated BusinessHours hours = 1;
}
