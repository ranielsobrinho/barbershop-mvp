syntax = "proto3";

package barbershop.services;

service ServicesService {
  rpc ListActiveServices(ListActiveServicesRequest) returns (ListActiveServicesResponse);
  rpc GetServiceById(GetServiceByIdRequest) returns (GetServiceByIdResponse);
  rpc CreateService(CreateServiceRequest) returns (CreateServiceResponse);
  rpc UpdateService(UpdateServiceRequest) returns (UpdateServiceResponse);
  rpc DeleteService(DeleteServiceRequest) returns (DeleteServiceResponse);
  rpc ToggleServiceActive(ToggleServiceActiveRequest) returns (ToggleServiceActiveResponse);
}

message Service {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 price_cents = 4;
  int32 slot_min = 5;
  bool active = 6;
  string created_at = 7;
  string updated_at = 8;
}

message ListActiveServicesRequest {}
message ListActiveServicesResponse {
  repeated Service services = 1;
}

message GetServiceByIdRequest {
  string id = 1;
}
message GetServiceByIdResponse {
  Service service = 1;
}

message CreateServiceRequest {
  string name = 1;
  string description = 2;
  int32 price_cents = 3;
  int32 slot_min = 4;
  bool active = 5;
}
message CreateServiceResponse {
  Service service = 1;
}

message UpdateServiceRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 price_cents = 4;
  int32 slot_min = 5;
  bool active = 6;
}
message UpdateServiceResponse {
  Service service = 1;
}

message DeleteServiceRequest {
  string id = 1;
}
message DeleteServiceResponse {
  bool success = 1;
}

message ToggleServiceActiveRequest {
  string id = 1;
  bool active = 2;
}
message ToggleServiceActiveResponse {
  Service service = 1;
}
