services:
  postgres:
    image: postgres:16-alpine
    container_name: barbershop-postgres
    environment:
      POSTGRES_USER: barbershop
      POSTGRES_PASSWORD: barbershop
      POSTGRES_DB: barbershop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbershop -d barbershop"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Gateway - Entry point for all external requests
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: barbershop-api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - TZ=UTC
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - COOKIE_SECRET=${COOKIE_SECRET:-cookie-secret-change-in-production}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - SCHEDULING_SERVICE_URL=http://scheduling-service:3002
      - SERVICES_SERVICE_URL=http://services-service:3003
      - BLOCKS_SERVICE_URL=http://blocks-service:3004
      - BUSINESS_HOURS_SERVICE_URL=http://business-hours-service:3005
      - SETTINGS_SERVICE_URL=http://settings-service:3006
    depends_on:
      - auth-service
      - scheduling-service
      - services-service
      - blocks-service
      - business-hours-service
      - settings-service
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules

  # Auth Service - Handles authentication and token validation
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: barbershop-auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - GRPC_PORT=5001
      - DATABASE_URL=postgresql://barbershop:barbershop@postgres:5432/barbershop
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - COOKIE_SECRET=${COOKIE_SECRET:-cookie-secret-change-in-production}
      - JWT_EXPIRES_IN=7d
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
      - ./shared:/shared

  # Scheduling Service - Core booking logic, availability, conflicts
  scheduling-service:
    build:
      context: ./services/scheduling-service
      dockerfile: Dockerfile
    container_name: barbershop-scheduling-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - GRPC_PORT=5002
      - DATABASE_URL=postgresql://barbershop:barbershop@postgres:5432/barbershop
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - COOKIE_SECRET=${COOKIE_SECRET:-cookie-secret-change-in-production}
      - AUTH_SERVICE_GRPC=auth-service:5001
      - SERVICES_SERVICE_GRPC=services-service:5003
      - BLOCKS_SERVICE_GRPC=blocks-service:5004
      - BUSINESS_HOURS_SERVICE_GRPC=business-hours-service:5005
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/scheduling-service:/app
      - /app/node_modules
      - ./shared:/shared

  # Services Service - CRUD for services
  services-service:
    build:
      context: ./services/services-service
      dockerfile: Dockerfile
    container_name: barbershop-services-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - PORT=3003
      - GRPC_PORT=5003
      - DATABASE_URL=postgresql://barbershop:barbershop@postgres:5432/barbershop
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - COOKIE_SECRET=${COOKIE_SECRET:-cookie-secret-change-in-production}
      - AUTH_SERVICE_GRPC=auth-service:5001
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/services-service:/app
      - /app/node_modules
      - ./shared:/shared

  # Blocks Service - Day/time blocking
  blocks-service:
    build:
      context: ./services/blocks-service
      dockerfile: Dockerfile
    container_name: barbershop-blocks-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - PORT=3004
      - GRPC_PORT=5004
      - DATABASE_URL=postgresql://barbershop:barbershop@postgres:5432/barbershop
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - COOKIE_SECRET=${COOKIE_SECRET:-cookie-secret-change-in-production}
      - AUTH_SERVICE_GRPC=auth-service:5001
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/blocks-service:/app
      - /app/node_modules
      - ./shared:/shared

  # Business Hours Service - Weekly schedule
  business-hours-service:
    build:
      context: ./services/business-hours-service
      dockerfile: Dockerfile
    container_name: barbershop-business-hours-service
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - PORT=3005
      - GRPC_PORT=5005
      - DATABASE_URL=postgresql://barbershop:barbershop@postgres:5432/barbershop
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - COOKIE_SECRET=${COOKIE_SECRET:-cookie-secret-change-in-production}
      - AUTH_SERVICE_GRPC=auth-service:5001
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/business-hours-service:/app
      - /app/node_modules
      - ./shared:/shared

  # Settings Service - General settings
  settings-service:
    build:
      context: ./services/settings-service
      dockerfile: Dockerfile
    container_name: barbershop-settings-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - PORT=3006
      - GRPC_PORT=5006
      - DATABASE_URL=postgresql://barbershop:barbershop@postgres:5432/barbershop
      - JWT_SECRET=${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      - COOKIE_SECRET=${COOKIE_SECRET:-cookie-secret-change-in-production}
      - AUTH_SERVICE_GRPC=auth-service:5001
      - TZ=UTC
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/settings-service:/app
      - /app/node_modules
      - ./shared:/shared

  # Frontend - Vite React app
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: barbershop-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
